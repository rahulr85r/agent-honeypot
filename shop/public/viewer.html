<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Detection log</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--muted:#667085;--line:#e4e7ec;--chip:#f2f4f7;
  --agent:#b42318;--agentbg:#fef3f2;--human:#067647;--humanbg:#ecfdf3;--review:#b54708;--reviewbg:#fffaeb;--brand:#1652f0}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e6e8ec;--muted:#98a2b3;--line:#2a2f3a;--chip:#222733;
  --agent:#ff8a80;--agentbg:#3a1714;--human:#6ce9a6;--humanbg:#0f2a1e;--review:#fdb022;--reviewbg:#33260b;--brand:#7aa2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.muted{color:var(--muted)} .small{font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
button,.chipbtn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);min-width:0;flex:1 1 160px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:22px} .tile span{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sess>summary{list-style:none;cursor:pointer;padding:12px 14px}
.sess>summary::-webkit-details-marker{display:none}
.tagrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 14px 0;font-size:13px}
.tagrow label{font-weight:600}
.tagrow input{font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);flex:0 1 240px;min-width:0}
.tagrow input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.tagrow .st{font-size:12px;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.acct{font-weight:700;font-size:15px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.agent{background:var(--agentbg);color:var(--agent)} .human{background:var(--humanbg);color:var(--human)} .review{background:var(--reviewbg);color:var(--review)}
.flag{background:var(--agent);color:#fff} .flag.miss{background:var(--review)}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px;margin:2px 4px 2px 0}
.chip.hit{background:var(--agentbg);color:var(--agent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.cell{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cell h4{margin:0 0 4px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.body{border-top:1px solid var(--line);padding:10px 14px 14px}
.ev{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin:8px 0}
.ev.agent{border-left-color:var(--agent);background:none;color:inherit} .ev.review{border-left-color:var(--review);background:none;color:inherit} .ev.human{border-left-color:var(--human);background:none;color:inherit}
.ev ul{margin:4px 0 0;padding-left:18px} .ev li{margin:2px 0}
.hardli{color:var(--agent)}
pre{background:var(--chip);border-radius:8px;padding:10px;overflow:auto;font-size:11.5px;max-height:420px;white-space:pre-wrap;word-break:break-word}
details.sec{margin:6px 0} details.sec>summary{cursor:pointer;font-weight:600}
.empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="loginbox" hidden>
  <div class="card" style="max-width:360px;margin:12vh auto 0;padding:20px">
    <h1 style="margin:0 0 4px">Detection log</h1>
    <div class="muted small" style="margin-bottom:14px">Sign in to view</div>
    <form id="lf">
      <input id="lu" autocomplete="username" placeholder="Username" style="width:100%;margin-bottom:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit">
      <input id="lp" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;margin-bottom:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit">
      <button type="submit" id="lgo" style="width:100%;border-radius:10px;background:var(--ink);color:var(--bg);border-color:var(--ink)">Sign in</button>
      <div id="lerr" class="small" style="color:var(--agent);margin-top:8px"></div>
    </form>
  </div>
</div>
<div class="wrap" id="app" hidden>
  <div class="bar">
    <div><h1>Detection log</h1><div class="muted small" id="upd">loading…</div></div>
    <div style="display:flex;gap:6px"><button id="ref">Refresh</button><button id="out">Sign out</button></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="filters" id="filters"></div>
  <div class="bar"><input type="search" id="q" placeholder="Filter by account or agent (e.g. jb, tony_a, Muse)"></div>
  <div id="list"></div>
  <datalist id="agentnames"><option value="ChatGPT agent"><option value="ChatGPT Atlas"><option value="Muse"><option value="Hark"><option value="Dots"><option value="Grok">
    <option value="Instinct"><option value="Claude"><option value="Perplexity"><option value="Perplexity Comet"><option value="Gemini"><option value="Manus"><option value="Human (me)"></datalist>
</div>
